name: Backend CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Black + Flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # ratchet:astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --locked --dev

      - name: Check formatting with Black
        run: |
          uv run black --check .

      - name: Lint with Flake8
        run: |
          uv run flake8 . --count --show-source --statistics

      # The Dockerfile installs from requirements.txt while uv.lock is the
      # source of truth. A Dependabot uv-group bump once regenerated
      # requirements.txt without most runtime deps and the v0.3.0 deploy died
      # in the migrate job (ModuleNotFoundError: flask_cors). Fail fast when
      # the two diverge.
      - name: Check requirements.txt matches uv.lock
        run: |
          uv export --format requirements-txt --no-dev --extra postgres \
            --no-hashes --no-emit-project -o /tmp/requirements.exported.txt
          # Compare requirement lines only — the autogenerated header embeds
          # the export command (incl. output path) so raw files never match.
          diff -u <(grep -v '^ *#' requirements.txt) <(grep -v '^ *#' /tmp/requirements.exported.txt) || {
            echo "::error::requirements.txt is out of sync with uv.lock — regenerate with: uv export --format requirements-txt --no-dev --extra postgres --no-hashes --no-emit-project -o requirements.txt"
            exit 1
          }

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # ratchet:astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --locked --dev

      - name: Type check with mypy
        run: |
          uv run mypy . --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # ratchet:astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --locked --dev

      - name: Run tests with coverage
        env:
          FLASK_SECRET_KEY: test-secret-key-for-ci
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: |
          uv run pytest --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  build:
    name: Build (docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      # Validates the image the release pipeline actually ships: the
      # Dockerfile installs from requirements.txt, which uv sync never
      # exercises. No push, no registry credentials.
      - name: Build Docker image
        run: docker build -f Dockerfile .

  security:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # ratchet:astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # Audits the pinned production set the Docker image actually installs.
      # Advisory for now (SPEC-01 §4.1) — promote to blocking after a clean week.
      - name: Run pip-audit (advisory)
        run: |
          uvx pip-audit -r requirements.txt
        continue-on-error: true
