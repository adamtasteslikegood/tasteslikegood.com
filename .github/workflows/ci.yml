name: Backend CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev/backend_sub222, develop]
  pull_request:
    branches: [main, dev/backend_sub222, develop]

jobs:
  lint:
    name: Lint (Black + Flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Check formatting with Black
        run: |
          uv run black --check .

      - name: Lint with Flake8
        run: |
          uv run flake8 . --count --show-source --statistics

      # The Dockerfile installs from requirements.txt while uv.lock is the
      # source of truth. A Dependabot uv-group bump once regenerated
      # requirements.txt without most runtime deps and the v0.3.0 deploy died
      # in the migrate job (ModuleNotFoundError: flask_cors). Fail fast when
      # the two diverge.
      - name: Check requirements.txt matches uv.lock
        run: |
          uv export --format requirements-txt --no-dev --extra postgres \
            --no-hashes --no-emit-project -o /tmp/requirements.exported.txt
          # Compare requirement lines only — the autogenerated header embeds
          # the export command (incl. output path) so raw files never match.
          diff -u <(grep -v '^ *#' requirements.txt) <(grep -v '^ *#' /tmp/requirements.exported.txt) || {
            echo "::error::requirements.txt is out of sync with uv.lock — regenerate with: uv export --format requirements-txt --no-dev --extra postgres --no-hashes --no-emit-project -o requirements.txt"
            exit 1
          }

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Type check with mypy
        run: |
          uv run mypy . --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run tests with coverage
        env:
          FLASK_SECRET_KEY: test-secret-key-for-ci
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: |
          uv run pytest --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security:
    name: Security Scan (Safety)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run safety check
        run: |
          uv pip install safety
          uv run safety check --json || true
        continue-on-error: true
