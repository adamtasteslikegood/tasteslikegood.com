name: 'CI'

on:
  push:
    branches:
      - 'main'
      - 'Main-development'
  pull_request:
    branches:
      - '**'

defaults:
  run:
    shell: 'bash'

jobs:
  test:
    name: 'Test'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'

      - name: 'Set up Python'
        uses: 'actions/setup-python@v5'
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 'Install dependencies'
        run: |-
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: 'Lint with flake8'
        run: |-
          # Stop the build on syntax errors or undefined names
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,.venv,venv,__pycache__,*.egg-info,dist,build

      - name: 'Run tests'
        env:
          FLASK_SECRET_KEY: 'test-secret-key'
          GOOGLE_API_KEY: 'test-api-key'
          TESTING: 'true'
        run: |-
          pytest tests/ -v --tb=short

  docker:
    name: 'Docker Build'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'

      - name: 'Build Docker image'
        run: |-
          docker build -t tasteslikegood:ci .
