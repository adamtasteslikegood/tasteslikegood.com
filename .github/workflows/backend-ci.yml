name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Black + Flake8 + Mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install black flake8 mypy types-requests types-jsonschema

      - name: Check formatting with Black
        run: black --check --line-length 100 .

      - name: Lint with Flake8
        run: flake8 . --count --show-source --statistics

      - name: Type check with mypy
        run: mypy app.py workflow_runs/app.py

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/
