name: '▶️ Gemini Invoke'

# Standalone successor to the dispatch-hub invoke deleted in 9ef54fc
# (SPEC-02 §3.7: docs/ci/refresh/SPEC-02-ai-triage-and-review.md).
#
# Two-phase, deterministically gated design. The old flow had the *model*
# poll comments for "/approve" before using write tools — a model-enforced
# check is not a security boundary. Here, GitHub itself adjudicates both
# gates via author_association in job-level `if:` expressions:
#
#   1. plan     — "@gemini-cli <request>" comment from OWNER/MEMBER/
#                 COLLABORATOR. Runs with READ-ONLY GitHub tools plus
#                 add_issue_comment; physically cannot mutate the repo.
#                 Posts a plan and terminates.
#   2. execute  — "/approve" comment from OWNER/MEMBER/COLLABORATOR.
#                 Only this run gets write-capable tools. An outsider's
#                 "/approve" never starts it: the association comes from
#                 GitHub's event payload, not from anything the model or
#                 comment author controls.

on:
  issue_comment:
    types:
      - 'created'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  plan:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    # Advisory automation: failures must not redden issues/PRs (SPEC-02 §3.3).
    continue-on-error: true
    # Deterministic trigger gate: association is computed by GitHub from the
    # actual commenter, and cannot be forged via comment content.
    if: |-
      contains(github.event.comment.body, '@gemini-cli') &&
      !startsWith(github.event.comment.body, '/approve') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'read'
    env:
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0' # ratchet:actions/checkout@v7

      # run-gemini-cli overwrites .gemini/commands/ with its own bundled
      # prompts, so a repo command named like a bundled one (gemini-invoke)
      # is silently ignored. Our hardened prompts use unique tlg-* names and
      # are installed here — unique filenames survive the action's copy.
      - name: 'Install repo command prompts'
        run: |-
          mkdir -p .gemini/commands
          cp .github/commands/tlg-invoke-plan.toml .github/commands/tlg-invoke-execute.toml .gemini/commands/

      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'read'

      - name: 'Run Gemini CLI (plan only — read tools + comment)'
        id: 'run_gemini_plan'
        uses: 'google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489' # ratchet:google-github-actions/run-gemini-cli@v0.1.22
        env:
          TITLE: '${{ github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          IS_PULL_REQUEST: '${{ !!github.event.issue.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ github.event.comment.body }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-invoke-plan'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server@sha256:5228f9e0b057d419e0e1919729493f75674304181f0ac85ae8385d89dd86affc"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "get_issue",
                    "get_issue_comments",
                    "list_issues",
                    "search_issues",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          prompt: '/tlg-invoke-plan'

      - name: 'Publish immutable approval reference'
        if: steps.run_gemini_plan.outcome == 'success'
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          PLAN_RUN_ID: '${{ github.run_id }}'
          TRIGGER_COMMENT_ID: '${{ github.event.comment.id }}'
          APP_SLUG: "${{ steps.mint_identity_token.outputs['app-slug'] }}"
        run: |-
          TRUSTED_BOT_LOGIN="github-actions[bot]"
          if [[ -n "${APP_SLUG}" ]]; then
            TRUSTED_BOT_LOGIN="${APP_SLUG}[bot]"
          fi
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[]' > "${RUNNER_TEMP}/gemini-comments.jsonl"
          PLAN_COMMENT_ID="$(
            jq -sr \
              --argjson trigger "${TRIGGER_COMMENT_ID}" \
              --arg bot "${TRUSTED_BOT_LOGIN}" '
              [.[] | select(
                .id > $trigger and
                .user.login == $bot and
                (.body | contains("## 🤖 AI Assistant: Plan of Action"))
              )] | last | .id // empty
            ' "${RUNNER_TEMP}/gemini-comments.jsonl"
          )"
          if [[ -z "${PLAN_COMMENT_ID}" ]]; then
            echo "::error::Gemini did not publish a trusted plan comment in this run"
            exit 1
          fi
          BODY="Plan comment ${PLAN_COMMENT_ID} is ready for review.

          Approve exactly this plan with:

          \`/approve ${PLAN_RUN_ID}\`

          <!-- gemini-plan-link:${PLAN_RUN_ID}:${PLAN_COMMENT_ID} -->"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${BODY}"

  execute:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    continue-on-error: true
    # Deterministic approval gate (SPEC-02 §3.7): write-capable execution
    # only ever starts from a fresh "/approve" comment whose author
    # association GitHub itself validated. The model never adjudicates
    # authorization.
    if: |-
      startsWith(github.event.comment.body, '/approve') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    env:
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Verify approval references a trusted plan'
        id: 'verify_plan'
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          APPROVAL_COMMENT: '${{ github.event.comment.body }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          APP_SLUG: "${{ steps.mint_identity_token.outputs['app-slug'] }}"
        run: |-
          if [[ ! "${APPROVAL_COMMENT}" =~ ^/approve[[:space:]]+([0-9]+)[[:space:]]*$ ]]; then
            echo "::error::Approval must be exactly '/approve <plan-run-id>'"
            exit 1
          fi
          PLAN_RUN_ID="${BASH_REMATCH[1]}"
          TRUSTED_BOT_LOGIN="github-actions[bot]"
          if [[ -n "${APP_SLUG}" ]]; then
            TRUSTED_BOT_LOGIN="${APP_SLUG}[bot]"
          fi
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[]' > "${RUNNER_TEMP}/gemini-comments.jsonl"
          PLAN_COMMENT_ID="$(
            jq -sr \
              --arg run "${PLAN_RUN_ID}" \
              --arg bot "${TRUSTED_BOT_LOGIN}" '
              [
                .[]
                | select(.user.login == $bot)
                | .body
                | capture("<!-- gemini-plan-link:" + $run + ":(?<id>[0-9]+) -->")?
              ] | last | .id // empty
            ' "${RUNNER_TEMP}/gemini-comments.jsonl"
          )"
          if [[ -z "${PLAN_COMMENT_ID}" ]]; then
            echo "::error::No trusted approval reference exists for plan run ${PLAN_RUN_ID}"
            exit 1
          fi
          if ! jq -se \
            --argjson id "${PLAN_COMMENT_ID}" \
            --arg bot "${TRUSTED_BOT_LOGIN}" '
            .[] | select(
              .id == $id and
              .user.login == $bot and
              (.body | contains("## 🤖 AI Assistant: Plan of Action"))
            )
          ' "${RUNNER_TEMP}/gemini-comments.jsonl" >/dev/null; then
            echo "::error::Referenced plan comment is missing or untrusted"
            exit 1
          fi
          echo "plan_run_id=${PLAN_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "plan_comment_id=${PLAN_COMMENT_ID}" >> "${GITHUB_OUTPUT}"

      - name: 'Checkout repository'
        uses: 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0' # ratchet:actions/checkout@v7

      # run-gemini-cli overwrites .gemini/commands/ with its own bundled
      # prompts, so a repo command named like a bundled one (gemini-invoke)
      # is silently ignored. Our hardened prompts use unique tlg-* names and
      # are installed here — unique filenames survive the action's copy.
      - name: 'Install repo command prompts'
        run: |-
          mkdir -p .gemini/commands
          cp .github/commands/tlg-invoke-plan.toml .github/commands/tlg-invoke-execute.toml .gemini/commands/

      - name: 'Run Gemini CLI (execute approved plan)'
        id: 'run_gemini_execute'
        uses: 'google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489' # ratchet:google-github-actions/run-gemini-cli@v0.1.22
        env:
          TITLE: '${{ github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          IS_PULL_REQUEST: '${{ !!github.event.issue.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          APPROVAL_COMMENT: '${{ github.event.comment.body }}'
          PLAN_RUN_ID: '${{ steps.verify_plan.outputs.plan_run_id }}'
          PLAN_COMMENT_ID: '${{ steps.verify_plan.outputs.plan_comment_id }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-invoke-execute'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server@sha256:5228f9e0b057d419e0e1919729493f75674304181f0ac85ae8385d89dd86affc"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "get_issue",
                    "get_issue_comments",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          prompt: '/tlg-invoke-execute'
