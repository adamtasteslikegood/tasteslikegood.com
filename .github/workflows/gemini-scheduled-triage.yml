name: '📋 Gemini Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours — hourly was over-provisioned for issue volume (SPEC-02 §3.4)
  pull_request:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/gemini-scheduled-triage.yml'
  push:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/gemini-scheduled-triage.yml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    env:
      # Current gemini-cli refuses to run in an untrusted directory even
      # without a checkout (see fix for the standalone triage, run
      # 29353718769). This job's Gemini step is skipped whenever there are
      # no untriaged issues, so historical green runs never exercised it —
      # the next real batch would have hit the trust error and paged via
      # the alert job. The workspace is empty; trusting it is safe.
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      # Gemini returns the triage JSON as its final response, which
      # run-gemini-cli exposes as the `summary` output. (The bundled prompt
      # wrote it to $GITHUB_ENV instead; gemini-cli now denies that shell
      # redirection, so every batch ran out of turns and nothing was ever
      # labelled.)
      triaged_issues: '${{ steps.gemini_issue_analysis.outputs.summary }}'
      issue_numbers: '${{ steps.find_issues.outputs.issue_numbers }}'
    steps:
      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9.0.0
        with:
          # NOTE: we intentionally do not use the minted token. The default
          # GITHUB_TOKEN provided by the action has enough permissions to read
          # the labels.
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100, // Maximum per page to reduce API calls
            })) {
              labels.push(...response.data);
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;

      - name: 'Find untriaged issues'
        id: 'find_issues'
        env:
          GITHUB_REPOSITORY: '${{ github.repository }}'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
        run: |-
          echo '🔍 Finding unlabeled issues and issues marked for triage...'
          UNLABELED_ISSUES="$(gh issue list \
            --state 'open' \
            --search 'no:label' \
            --json number,title,body \
            --limit '100' \
            --repo "${GITHUB_REPOSITORY}"
          )"
          NEEDS_TRIAGE_ISSUES="$(gh issue list \
            --state 'open' \
            --search 'label:"status/needs-triage"' \
            --json number,title,body \
            --limit '100' \
            --repo "${GITHUB_REPOSITORY}"
          )"
          ISSUES="$(jq -cn \
            --argjson unlabeled "${UNLABELED_ISSUES}" \
            --argjson needs_triage "${NEEDS_TRIAGE_ISSUES}" \
            '$unlabeled + $needs_triage | unique_by(.number)'
          )"

          echo '📝 Setting output for GitHub Actions...'
          echo "issues_to_triage=${ISSUES}" >> "${GITHUB_OUTPUT}"

          ISSUE_NUMBERS="$(echo "${ISSUES}" | jq -c '[.[].number]')"
          echo "issue_numbers=${ISSUE_NUMBERS}" >> "${GITHUB_OUTPUT}"

          ISSUE_COUNT="$(echo "${ISSUES}" | jq 'length')"
          echo "✅ Found ${ISSUE_COUNT} issue(s) to triage! 🎯"

      # Only the prompt directory: the triage job never needs the code.
      - name: 'Checkout command prompts'
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          persist-credentials: 'false'
          sparse-checkout: '.github/commands'
          sparse-checkout-cone-mode: 'false'

      # run-gemini-cli overwrites .gemini/commands/ with its own bundled
      # prompts, so the repo prompt uses a unique tlg-* name (same pattern as
      # gemini-invoke.yml). The issue data goes in a file the prompt embeds
      # with @{...}, so Gemini needs no tools at all.
      - name: 'Prepare prompt and context'
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        env:
          ISSUES_TO_TRIAGE: '${{ steps.find_issues.outputs.issues_to_triage }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
        run: |-
          mkdir -p .gemini/commands
          cp .github/commands/tlg-scheduled-triage.toml .gemini/commands/
          jq -n \
            --arg labels "${AVAILABLE_LABELS}" \
            --arg issues "${ISSUES_TO_TRIAGE}" \
            '{available_labels: $labels, issues_to_triage: ($issues | fromjson)}' \
            > .gemini/context.json

      - name: 'Run Gemini Issue Analysis'
        id: 'gemini_issue_analysis'
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        uses: 'google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489' # ratchet:google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: '' # Do not pass any auth token here since this runs on untrusted inputs
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-scheduled-triage'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/tlg-scheduled-triage'

  label:
    runs-on: 'ubuntu-latest'
    needs:
      - 'triage'
    if: |-
      needs.triage.outputs.available_labels != '' &&
      needs.triage.outputs.available_labels != '[]' &&
      needs.triage.outputs.triaged_issues != '' &&
      needs.triage.outputs.triaged_issues != '[]'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply labels'
        env:
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          TRIAGED_ISSUES: '${{ needs.triage.outputs.triaged_issues }}'
          ISSUE_NUMBERS: '${{ needs.triage.outputs.issue_numbers }}'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9.0.0
        with:
          # Use the provided token so that the "gemini-cli" is the actor in the
          # log for what changed the labels.
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            // Parse the available labels
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',')
              .map((label) => label.trim())
              .sort()

            // Parse out the triaged issues. The model is told to answer with
            // bare JSON, but tolerate a ```json fence around it.
            const raw = (process.env.TRIAGED_ISSUES || '').trim()
              .replace(/^```(?:json)?\s*/i, '')
              .replace(/\s*```$/, '');
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (error) {
              core.setFailed(`Gemini response is not valid JSON: ${error.message}`);
              return;
            }
            if (!Array.isArray(parsed)) {
              core.setFailed('Gemini response is not a JSON array.');
              return;
            }

            // Only touch issues that were in this batch, in case the issue
            // text prompt-injected other issue numbers.
            const batch = new Set(JSON.parse(process.env.ISSUE_NUMBERS || '[]'));
            // Normalize issue_number first: the model may return "123".
            const triagedIssues = parsed
              .filter((issue) => issue && typeof issue === 'object')
              .map((issue) => ({ ...issue, issue_number: Number(issue.issue_number) }))
              .filter((issue) => Number.isInteger(issue.issue_number) && batch.has(issue.issue_number))
              .sort((a, b) => a.issue_number - b.issue_number)

            core.debug(`Triaged issues: ${JSON.stringify(triagedIssues)}`);

            // Iterate over each label
            for (const issue of triagedIssues) {
              if (!issue) {
                core.debug(`Skipping empty issue: ${JSON.stringify(issue)}`);
                continue;
              }

              const issueNumber = issue.issue_number;
              if (!issueNumber) {
                core.debug(`Skipping issue with no data: ${JSON.stringify(issue)}`);
                continue;
              }

              // Extract and reject invalid labels - we do this just in case
              // someone was able to prompt inject malicious labels.
              // Skip malformed entries instead of failing the whole batch.
              const rawLabels = Array.isArray(issue.labels_to_set) ? issue.labels_to_set : [];
              let labelsToAdd = rawLabels
                .filter((label) => typeof label === 'string')
                .map((label) => label.trim())
                .filter((label) => availableLabels.includes(label))
                .sort()

              core.debug(`Identified labels to add: ${JSON.stringify(labelsToAdd)}`);

              if (labelsToAdd.length === 0) {
                core.info(`Skipping issue #${issueNumber} - no labels to set.`)
                continue;
              }

              core.debug(`Adding labels to issue #${issueNumber}: ${labelsToAdd.join(', ')} (${issue.explanation || 'no explanation'})`)

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: labelsToAdd,
              });

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'status/needs-triage',
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

  # A silently-failing scheduled workflow must page someone (SPEC-02 §3.3).
  # This must be its own job: a step inside triage/label cannot see the other
  # job's result, triage only has issues:read, and job-level continue-on-error
  # anywhere in this workflow would report failed jobs as succeeded and keep
  # failure() here from ever firing.
  alert:
    runs-on: 'ubuntu-latest'
    needs:
      - 'triage'
      - 'label'
    if: |-
      failure() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      issues: 'write'
    steps:
      - name: 'Open or update ci-health issue'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9.0.0
        with:
          script: |-
            const title = '[ci-health] gemini-scheduled-triage is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Scheduled issue triage failed. Latest failing run: ${runUrl}\n\n` +
              'One of the `triage`/`label` jobs concluded `failure`. Check API keys / WIF ' +
              'configuration and the run logs. This issue is updated automatically by the ' +
              '`alert` job in `gemini-scheduled-triage.yml`; close it once runs are green.';

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'ci-health',
                color: 'B60205',
                description: 'Automated alerts about CI / agent workflow health',
              });
            } catch (e) {
              // Only tolerate "label already exists" (422 validation error);
              // anything else (permissions, outage) must fail the alert job
              // visibly rather than half-run.
              const alreadyExists = e.status === 422 &&
                (e.response?.data?.errors || []).some((err) => err.code === 'already_exists');
              if (!alreadyExists) {
                throw e;
              }
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-health',
              per_page: 100,
            });
            const match = existing.data.find((issue) => issue.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Still failing: ${runUrl}`,
              });
              core.info(`Updated existing ci-health issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci-health'],
              });
              core.info(`Opened ci-health issue #${created.data.number}`);
            }
