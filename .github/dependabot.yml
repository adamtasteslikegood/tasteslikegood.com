version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev/backend_sub222"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "/.agent/skills/dependency-auditor/test-project/**"
      - "/.claude/skills/dependency-auditor/test-project/**"
      - "/.codex/skills/dependency-auditor/test-project/**"
      - "/.github/skills/dependency-auditor/test-project/**"
      - "/.zed/skills/dependency-auditor/test-project/**"
