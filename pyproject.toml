[project]
name = "tasteslikegood-com"
version = "0.1.0"
description = "A Flask-based web application for viewing and generating vegan recipes using Google's Gemini AI models"
readme = "README.md"
requires-python = ">=3.13,<3.14"  # Only support Python 3.13 (3.14+ not yet fully supported by all deps)
license = { text = "MIT" }
authors = [
    { name = "Tastes Like Good Team", email = "contact@tasteslikegood.com" }
]
keywords = ["vegan", "recipes", "ai", "gemini", "flask", "web-app", "food"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: Flask",
]

dependencies = [
    # Web Framework
    "flask==3.1.3",
    "werkzeug==3.1.8",
    "jinja2==3.1.6",
    "blinker==1.9.0",
    "itsdangerous==2.2.0",
    # Database (Phase 3) - psycopg2 is optional, only needed for PostgreSQL
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "flask-caching==2.4.1",
    "sqlalchemy>=2.0.51", # Use stable 2.0.x with Python 3.13 support
    # Google AI & Authentication
    "google-genai==2.11.0",
    "google-generativeai==0.8.6",
    "google-ai-generativelanguage==0.6.15",
    "google-auth==2.56.0",
    "google-auth-oauthlib==1.4.0",
    "google-api-python-client==2.198.0",
    "googleapis-common-protos==1.75.0",
    # GCP runtime services (image storage, async generation, Valkey IAM auth).
    # These were only ever declared in requirements.txt; they belong here so
    # the uv.lock -> requirements.txt export carries them (July 2026 incident:
    # a Dependabot uv-group bump regenerated requirements.txt without them and
    # the production image lost half its runtime deps).
    "google-cloud-storage==3.13.0",
    "google-cloud-pubsub>=2.19.0",
    "redis==8.0.1",
    # Data Validation
    "jsonschema==4.26.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    # Networking & HTTP
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "urllib3==2.7.0",
    "certifi==2026.6.17",
    "charset-normalizer==3.4.9",
    "idna==3.18",
    # Utilities
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "distro==1.9.0",
    "sniffio==1.3.1",
    "anyio==4.14.2",
    "typing-extensions==4.16.0",
    "tenacity==9.1.4",
    "websockets==16.1.1",
    "cachetools==7.1.4",
    # Cryptography & Security
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "rsa==4.9.1",
    "flask-cors==6.0.5",
    "pandas>=3.0.3",
    "ddtrace>=4.11.1",
    "gunicorn>=26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "black>=26.5.1",
    "flake8>=6.0.0",
    "mypy>=2.3.0",
    "types-requests>=2.33.0.20260712",
    "types-jsonschema>=4.26.0.20260518",
]
postgres = [
    # PostgreSQL support (for production deployments)
    "psycopg2-binary>=2.9.12",
]

[project.urls]
Homepage = "https://tasteslikegood.com"
Documentation = "https://github.com/yourusername/tasteslikegood.com/blob/main/README.md"
Repository = "https://github.com/yourusername/tasteslikegood.com"
Issues = "https://github.com/yourusername/tasteslikegood.com/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is a Flask application, not a distributable package
# Don't try to build a wheel
only-packages = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
# scripts/ has no __init__.py, so without explicit package bases mypy maps
# scripts/backfill_slugs.py to two module names and aborts the whole run.
# (This lived in setup.cfg's [mypy] before, but pyproject's [tool.mypy]
# shadows setup.cfg entirely — which is how the crash shipped.)
explicit_package_bases = true
ignore_missing_imports = true
exclude = [
    "migrate_recipes\\.py",
    "debug_generation\\.py",
    "migrations/",
    "workflow_runs/",
]

[tool.uv]
# This is a Flask application, not a distributable package
package = false
# Floor pins for transitive deps with known CVEs (GHSA-537c-gmf6-5ccf,
# GHSA-2h4p-vjrc-8xpq, GHSA-v92g-xgxw-vvmm, GHSA-5239-wwwm-4pmq,
# PYSEC-2026-2132, PYSEC-2026-3444) — none are direct dependencies, so bump
# them via constraints rather than adding them to [project.dependencies] or
# [dependency-groups].
constraint-dependencies = [
    "cryptography>=48.0.1",  # via google-auth
    "mako>=1.3.12",          # via alembic (flask-migrate)
    "pygments>=2.20.0",      # via pytest (dev group only)
    "click>=8.3.3",          # via flask
    "httplib2>=0.32.0",      # via google-api-python-client
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "black>=26.5.1",
    "flake8>=6.0.0",
    "mypy>=2.3.0",
    "types-requests>=2.33.0.20260712",
    "types-jsonschema>=4.26.0.20260518",
]
