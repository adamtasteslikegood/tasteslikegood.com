{% extends "base.html" %}

{% block title %}Welcome to TastesLikeGood.com!!!{% endblock %}

{% block content %}
    <h1>Welcome to TastesLikeGood.com!!!</h1>
    <ul class="recipe-list">
        {% for recipe in recipes %}
        <li>
            <a href="{{ url_for('recipes.show_recipe', filename=recipe.filename) }}">{{ recipe.name }}</a>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
