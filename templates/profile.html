<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - TastesLikeGood.com</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>User Profile</h1>
    <div class="profile-container">
        {% if user_info %}
            <p><strong>Name:</strong> {{ user_info.name }}</p>
            <p><strong>Email:</strong> {{ user_info.email }}</p>
            <p><strong>Verified Email:</strong> {{ user_info.verified_email }}</p>
            <p><img src="{{ user_info.picture }}" alt="Profile Picture" width="100"></p>
        {% else %}
            <p>No user information available.</p>
        {% endif %}
        <br>
        <a href="{{ url_for('index') }}">Back to Home</a> | <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
</body>
</html>
